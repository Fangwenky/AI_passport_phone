<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Passport</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#eaf7ff;background:#061b3a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,#1677ff55,transparent 35%),linear-gradient(145deg,#06162f,#0b4d80);padding:28px}.shell{max-width:1120px;margin:auto}.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}.logo{width:56px;height:56px;border-radius:18px;background:#ffffff18 url(icon.png) center/cover;box-shadow:0 16px 45px #00142b}.title h1{margin:0;font-size:24px;letter-spacing:.04em}.title p{margin:4px 0;color:#a9ddf5}.status{margin-left:auto;padding:10px 14px;border:1px solid #ffffff28;background:#ffffff10;border-radius:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6d88a0;margin-right:8px}.dot.on{background:#58e3b2;box-shadow:0 0 14px #58e3b2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#eaf7fff2;color:#08233f;border:1px solid #fff;border-radius:24px;padding:22px;box-shadow:0 22px 60px #00152c66}.card.wide{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.metric{background:#d9f2ff;border-radius:16px;padding:14px;min-width:138px}.metric small{color:#527895;display:block}.metric b{font-size:20px}.code{font:700 28px ui-monospace;letter-spacing:.16em}.btn{border:0;border-radius:13px;padding:11px 16px;background:#1677ff;color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#d7ecf8;color:#0b4d80}.btn:active{transform:scale(.98)}.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preset{border:2px solid transparent;border-radius:16px;padding:14px;text-align:left;cursor:pointer}.preset.ocean{background:linear-gradient(135deg,#061b3a,#1677ff);color:#fff}.preset.midnight{background:linear-gradient(135deg,#171925,#604359);color:#ffeae3}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.field label{font-size:12px;color:#527895;display:block;margin:0 0 5px}.field input,.profile input,.profile textarea{width:100%;border:1px solid #a9ddf5;border-radius:10px;padding:9px;background:#fff;color:#08233f}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile textarea{min-height:82px;resize:vertical}.span2{grid-column:1/-1}.hint{color:#527895;font-size:13px;line-height:1.5}.toast{position:fixed;right:26px;bottom:24px;background:#08233f;color:white;padding:12px 16px;border-radius:12px;opacity:0;transition:.25s}.toast.show{opacity:1}@media(max-width:900px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.colors{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><header class="top"><img class="logo" src="icon.png"><div class="title"><h1>AI Passport</h1><p>手机 AI 外设控制台</p></div><div class="status"><span id="dot" class="dot"></span><span id="state">桥接未启动</span></div></header><main class="grid">
<section class="card"><h2>连接</h2><div class="row"><div class="metric"><small>配对码</small><b id="code" class="code">------</b></div><div class="metric"><small>手机</small><b id="phone">未连接</b></div><div class="metric"><small>Codex</small><b id="codex">检查中</b></div></div><p class="hint">USB 调试开启后，点击启动。手机输入配对码并点“连接 / 配对”，应用会优先通过 USB 建立连接。</p><div class="row"><button class="btn" id="start">启动桥接</button><button class="btn secondary" id="stop">停止</button></div></section>
<section class="card"><h2>手机功能</h2><label><input type="checkbox" id="moduleCodex" checked> Codex 工作流监看</label><br><br><label><input type="checkbox" id="moduleProfile" checked> 个人名片</label><p class="hint">只勾选希望出现在手机功能列表中的模块。</p><button class="btn" id="saveModules">保存模块</button></section>
<section class="card wide"><h2>外观与角色</h2><div class="presets"><button class="preset ocean" data-theme="ocean"><b>深海蓝 · 鲸鱼少女</b><br><small>默认开源皮肤</small></button><button class="preset midnight" data-theme="midnight"><b>午夜莓果</b><br><small>柔和暗色皮肤</small></button></div><div class="colors" id="colors"></div><div class="row" style="margin-top:14px"><button class="btn secondary" id="choose">选择自定义角色 PNG</button><button class="btn" id="saveAppearance">保存自定义配色</button></div></section>
<section class="card wide"><h2>个人名片</h2><div class="profile"><div><label>姓名</label><input id="name"></div><div><label>一句话介绍</label><input id="headline"></div><div class="span2"><label>自我介绍</label><textarea id="bio"></textarea></div><div><label>个人网站</label><input id="website"></div><div><label>邮箱</label><input id="email"></div><div class="span2"><label>其他联系方式</label><input id="contact"></div></div><div class="row" style="margin-top:14px"><button class="btn" id="saveProfile">保存名片</button></div></section>
</main></div><div class="toast" id="toast"></div><script>
const colorKeys={backgroundStart:'背景起色',backgroundEnd:'背景止色',surface:'卡片',ink:'正文',muted:'次要文字',accent:'强调色',line:'边框'};
const presets={ocean:{backgroundStart:'#061B3A',backgroundEnd:'#0B4D80',surface:'#EAF7FF',ink:'#08233F',muted:'#527895',accent:'#1677FF',line:'#A9DDF5'},midnight:{backgroundStart:'#171925',backgroundEnd:'#403042',surface:'#282536',ink:'#FFEDE5',muted:'#CCB3B3',accent:'#E9A895',line:'#64505F'}};
let appearance={theme:'ocean',character:'default',colors:{...presets.ocean},revision:0},modules={enabled:['codex','profile'],profile:{name:'',headline:'',bio:'',website:'',email:'',contact:''}},imageBase64=null;
const colors=document.querySelector('#colors');for(const [key,label] of Object.entries(colorKeys)){colors.insertAdjacentHTML('beforeend',`<div class="field"><label>${label}</label><input id="c-${key}" value="${appearance.colors[key]}"></div>`)}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function fill(){for(const k in colorKeys)document.querySelector('#c-'+k).value=appearance.colors[k];for(const k of ['name','headline','bio','website','email','contact'])document.querySelector('#'+k).value=modules.profile[k]||'';document.querySelector('#moduleCodex').checked=modules.enabled.includes('codex');document.querySelector('#moduleProfile').checked=modules.enabled.includes('profile')}
async function refresh(){const s=await window.passport.status();document.querySelector('#dot').classList.toggle('on',s.ok);document.querySelector('#state').textContent=s.ok?(s.connected?'手机已连接':'桥接已启动'):'桥接未启动';document.querySelector('#code').textContent=s.pairingCode||'------';document.querySelector('#phone').textContent=s.connected?'已连接':'等待中';document.querySelector('#codex').textContent=s.codexConnected?'已连接':'未连接';if(s.ok&&!window.loaded){appearance=s.appearance;modules=s.modules;fill();window.loaded=true}}
document.querySelector('#start').onclick=async()=>{const r=await window.passport.start();toast(r.usb?'桥接启动，USB 已就绪':'桥接启动；请连接 USB 并开启调试');setTimeout(refresh,900)};document.querySelector('#stop').onclick=async()=>{await window.passport.stop();toast('桥接已停止');setTimeout(refresh,700)};
document.querySelectorAll('.preset').forEach(b=>b.onclick=async()=>{appearance={theme:b.dataset.theme,character:'default',colors:{...presets[b.dataset.theme]},revision:appearance.revision};fill();await saveAppearance()});
async function saveAppearance(){for(const k in colorKeys)appearance.colors[k]=document.querySelector('#c-'+k).value;const payload={...appearance,theme:imageBase64?'custom':appearance.theme,character:imageBase64?'custom':appearance.character};if(imageBase64)payload.imageBase64=imageBase64;appearance=await window.passport.saveAppearance(payload);imageBase64=null;fill();toast('外观已同步')}
document.querySelector('#choose').onclick=async()=>{imageBase64=await window.passport.chooseCharacter();if(imageBase64){appearance.theme='custom';appearance.character='custom';toast('已选择角色，点击保存自定义配色')}};document.querySelector('#saveAppearance').onclick=saveAppearance;
function readModules(){modules.enabled=[];if(document.querySelector('#moduleCodex').checked)modules.enabled.push('codex');if(document.querySelector('#moduleProfile').checked)modules.enabled.push('profile');for(const k of ['name','headline','bio','website','email','contact'])modules.profile[k]=document.querySelector('#'+k).value}
async function saveModules(){readModules();modules=await window.passport.saveModules(modules);toast('手机功能已同步')};document.querySelector('#saveModules').onclick=saveModules;document.querySelector('#saveProfile').onclick=saveModules;
fill();refresh();setInterval(refresh,2000);
</script></body></html>
