<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Passport</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;--bg-start:#061B3A;--bg-end:#0B4D80;--canvas:#DCEFFF;--surface:#EAF7FF;--ink:#08233F;--muted:#527895;--accent:#1677FF;--line:#A9DDF5;--chrome-text:#fff;color:var(--chrome-text);background:var(--bg-start);transition:background .35s,color .35s}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 35%),linear-gradient(145deg,var(--bg-start),var(--bg-end));transition:background .4s;padding:28px}.shell{max-width:1120px;margin:auto}.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}.logo{width:56px;height:56px;border-radius:18px;background:#ffffff18 url(icon.png) center/cover;box-shadow:0 16px 45px #00142b}.title h1{margin:0;font-size:24px;letter-spacing:.04em}.title p{margin:4px 0;color:color-mix(in srgb,var(--chrome-text) 65%,transparent)}.status{margin-left:auto;padding:10px 14px;border:1px solid #ffffff28;background:#ffffff10;border-radius:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6d88a0;margin-right:8px}.dot.on{background:#58e3b2;box-shadow:0 0 14px #58e3b2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:color-mix(in srgb,var(--surface) 96%,transparent);color:var(--ink);border:1px solid var(--line);transition:background .35s,color .35s,border-color .35s;border-radius:24px;padding:22px;box-shadow:0 22px 60px #00152c66}.card.wide{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.metric{background:var(--canvas);border-radius:16px;padding:14px;min-width:138px}.metric small{color:var(--muted);display:block}.metric b{font-size:20px}.code{font:700 28px ui-monospace;letter-spacing:.16em}.btn{border:0;border-radius:13px;padding:11px 16px;background:var(--accent);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:var(--canvas);color:var(--ink)}.btn:active{transform:scale(.98)}.scheme-head{display:flex;align-items:center;margin-bottom:15px}.scheme-head h2{margin:0}.scheme-head .btn{margin-left:auto}.scheme-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.scheme-card{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;text-align:left;color:var(--ink);cursor:pointer}.scheme-card.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.scheme-card.add{min-height:248px;display:grid;place-content:center;text-align:center;color:var(--accent);border-style:dashed}.scheme-preview,.live-preview{position:relative;overflow:hidden;border-radius:14px;height:190px;background:linear-gradient(135deg,var(--start),var(--end));color:var(--text)}.scheme-preview img,.live-preview img{position:absolute;height:112%;width:64%;object-fit:contain;right:-2%;bottom:-14%}.mock{position:absolute;z-index:1;left:17px;top:15px}.mock b{display:block;font:700 38px Georgia,serif;margin:8px 0 2px}.mock small{display:block}.mock em{display:inline-block;margin-top:11px;padding:6px 9px;border-radius:20px;background:var(--surface);color:var(--accent);font-style:normal;font-size:11px}.scheme-meta{display:flex;align-items:center;padding:12px 3px 2px}.scheme-meta b{font-size:18px}.scheme-meta small{display:block;color:var(--muted);margin-top:3px}.check{margin-left:auto;color:var(--accent);font-size:22px}.editor-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.live-preview{height:390px}.live-preview .mock{left:28px;top:28px}.live-preview .mock b{font-size:64px}.editor-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field label,.profile label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}.field-row{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.field-row input[type=color]{width:38px;height:38px;border:0;background:transparent;padding:4px}.field-row input[type=text],.profile input,.profile textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--canvas);color:var(--ink)}.field-row input[type=text]{border:0;border-radius:0;font:12px ui-monospace}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile textarea{min-height:82px;resize:vertical}.span2{grid-column:1/-1}.hint{color:var(--muted);font-size:13px;line-height:1.5}.hidden{display:none}.toast{position:fixed;right:26px;bottom:24px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;opacity:0;transition:.25s}.toast.show{opacity:1}@media(max-width:900px){.grid,.scheme-grid,.editor-layout{grid-template-columns:1fr}.card.wide{grid-column:auto}.colors{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><header class="top"><img class="logo" src="icon.png"><div class="title"><h1>AI Passport</h1><p>手机 AI 外设控制台</p></div><div class="status"><span id="dot" class="dot"></span><span id="state">桥接未启动</span></div></header><main class="grid">
<section class="card"><h2>连接</h2><div class="row"><div class="metric"><small>配对码</small><b id="code" class="code">------</b></div><div class="metric"><small>手机</small><b id="phone">未连接</b></div><div class="metric"><small>Codex</small><b id="codex">检查中</b></div></div><p class="hint">USB 调试开启后点击启动。手机输入配对码并点“连接 / 配对”。</p><div class="row"><button class="btn" id="start">启动桥接</button><button class="btn secondary" id="stop">停止</button></div></section>
<section class="card"><h2>手机功能</h2><label><input type="checkbox" id="moduleCodex" checked> Codex 工作流监看</label><br><br><label><input type="checkbox" id="moduleProfile" checked> 个人名片</label><p class="hint">只显示勾选的手机模块。</p><button class="btn" id="saveModules">保存模块</button></section>
<section class="card wide" id="library"><div class="scheme-head"><div><h2>背景方案</h2><div class="hint">点击卡片即可切换并同步到手机。</div></div><button class="btn" id="addScheme">＋ 添加背景方案</button></div><div class="scheme-grid" id="schemeGrid"></div></section>
<section class="card wide hidden" id="editor"><div class="scheme-head"><button class="btn secondary" id="cancelEditor">‹ 返回方案库</button><h2 style="margin-left:14px">可视化背景编辑器</h2></div><div class="editor-layout"><div class="live-preview" id="livePreview"><div class="mock"><small>AI PASSPORT ✦</small><b>12:48</b><small>9 月 25 日 · 星期五</small><em>● 已连接</em></div><img id="previewImage" src="icon.png"></div><div class="editor-panel"><div class="profile"><div><label>方案名称</label><input id="schemeName" placeholder="例如：樱花午后"></div><div><label>方案说明</label><input id="schemeNote" placeholder="例如：淡粉 · 柔光"></div></div><div class="colors" id="colors"></div><div class="row" style="margin-top:16px"><button class="btn secondary" id="choose">选择角色 PNG</button><button class="btn secondary hidden" id="defaultCharacter">使用默认角色</button><button class="btn" id="saveScheme">保存并启用</button></div></div></div></section>
<section class="card wide"><h2>个人名片</h2><div class="profile"><div><label>姓名</label><input id="name"></div><div><label>一句话介绍</label><input id="headline"></div><div class="span2"><label>自我介绍</label><textarea id="bio"></textarea></div><div><label>个人网站</label><input id="website"></div><div><label>邮箱</label><input id="email"></div><div class="span2"><label>其他联系方式</label><input id="contact"></div></div><div class="row" style="margin-top:14px"><button class="btn" id="saveProfile">保存名片</button></div></section>
</main></div><div class="toast" id="toast"></div><script>
const colorKeys={backgroundStart:'背景起色',backgroundEnd:'背景止色',surface:'卡片',ink:'正文',muted:'次要文字',accent:'强调色',line:'边框'};
const ocean={backgroundStart:'#061B3A',backgroundEnd:'#0B4D80',surface:'#EAF7FF',ink:'#08233F',muted:'#527895',accent:'#1677FF',line:'#A9DDF5'};
let appearance={schemeId:'ocean',theme:'ocean',character:'default',colors:{...ocean},revision:0},schemes=[],activeSchemeId='ocean',modules={enabled:['codex','profile'],profile:{name:'',headline:'',bio:'',website:'',email:'',contact:''}},imageBase64=null,defaultImage='icon.png';
const colors=document.querySelector('#colors');for(const [key,label] of Object.entries(colorKeys)){colors.insertAdjacentHTML('beforeend',`<div class="field"><label>${label}</label><div class="field-row"><input type="color" id="pick-${key}"><input type="text" id="c-${key}"></div></div>`);document.querySelector('#pick-'+key).oninput=e=>{document.querySelector('#c-'+key).value=e.target.value.toUpperCase();updatePreview()};document.querySelector('#c-'+key).oninput=updatePreview}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mixHex(a,b,t){const av=parseInt(a.slice(1),16),bv=parseInt(b.slice(1),16),part=n=>Math.round(((av>>n)&255)*(1-t)+((bv>>n)&255)*t);return'#'+[part(16),part(8),part(0)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
function applyDesktopTheme(c){const root=document.documentElement.style;root.setProperty('--bg-start',c.backgroundStart);root.setProperty('--bg-end',c.backgroundEnd);root.setProperty('--surface',c.surface);root.setProperty('--canvas',mixHex(c.surface,c.accent,.075));root.setProperty('--ink',c.ink);root.setProperty('--muted',c.muted);root.setProperty('--accent',c.accent);root.setProperty('--line',c.line);root.setProperty('--chrome-text',isDark(c.backgroundStart,c.backgroundEnd)?'#FFFFFF':'#151515')}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function fillProfile(){for(const k of ['name','headline','bio','website','email','contact'])document.querySelector('#'+k).value=modules.profile[k]||'';document.querySelector('#moduleCodex').checked=modules.enabled.includes('codex');document.querySelector('#moduleProfile').checked=modules.enabled.includes('profile')}
function isDark(a,b){const f=x=>{const n=parseInt(x.slice(1),16)||0;return(.2126*((n>>16)&255)+.7152*((n>>8)&255)+.0722*(n&255))/255};return(f(a)+f(b))/2<.53}
async function renderSchemes(){const grid=document.querySelector('#schemeGrid');grid.innerHTML='';for(const scheme of schemes){const image=await window.passport.schemeImage(scheme.id);const c=scheme.appearance.colors,dark=isDark(c.backgroundStart,c.backgroundEnd);const button=document.createElement('button');button.className='scheme-card'+(activeSchemeId===scheme.id?' active':'');button.innerHTML=`<div class="scheme-preview" style="--start:${c.backgroundStart};--end:${c.backgroundEnd};--surface:${c.surface};--accent:${c.accent};--text:${dark?'#fff':'#111'}"><div class="mock"><small>AI PASSPORT ✦</small><b>12:48</b><small>9 月 25 日 · 星期五</small><em>● 已连接</em></div><img src="${image}"></div><div class="scheme-meta"><div><b>${esc(scheme.name)}</b><small>${esc(scheme.note||'自定义背景方案')}</small></div><span class="check">${activeSchemeId===scheme.id?'●':'○'}</span></div>`;button.onclick=()=>activateScheme(scheme.id);grid.appendChild(button)}const add=document.createElement('button');add.className='scheme-card add';add.innerHTML='<div><b style="font-size:32px">＋</b><br><b>添加背景方案</b><div class="hint">角色、颜色与实时预览</div></div>';add.onclick=openEditor;grid.appendChild(add)}
async function activateScheme(id){const lib=await window.passport.activateScheme(id);schemes=lib.schemes;activeSchemeId=lib.activeId;appearance=schemes.find(x=>x.id===activeSchemeId).appearance;applyDesktopTheme(appearance.colors);await renderSchemes();toast('电脑与手机背景方案已切换')}
function openEditor(){document.querySelector('#library').classList.add('hidden');document.querySelector('#editor').classList.remove('hidden');document.querySelector('#schemeName').value='';document.querySelector('#schemeNote').value='';for(const k in colorKeys){document.querySelector('#c-'+k).value=appearance.colors[k];document.querySelector('#pick-'+k).value=appearance.colors[k]}imageBase64=null;document.querySelector('#previewImage').src=defaultImage;document.querySelector('#defaultCharacter').classList.add('hidden');updatePreview()}
function closeEditor(){document.querySelector('#editor').classList.add('hidden');document.querySelector('#library').classList.remove('hidden')}
function updatePreview(){const p=document.querySelector('#livePreview'),c={};for(const k in colorKeys)c[k]=document.querySelector('#c-'+k).value;p.style.setProperty('--start',c.backgroundStart);p.style.setProperty('--end',c.backgroundEnd);p.style.setProperty('--surface',c.surface);p.style.setProperty('--accent',c.accent);p.style.setProperty('--text',isDark(c.backgroundStart,c.backgroundEnd)?'#fff':'#111')}
async function refresh(){const s=await window.passport.status();document.querySelector('#dot').classList.toggle('on',s.ok);document.querySelector('#state').textContent=s.ok?(s.connected?'手机已连接':'桥接已启动'):'桥接未启动';document.querySelector('#code').textContent=s.pairingCode||'------';document.querySelector('#phone').textContent=s.connected?'已连接':'等待中';document.querySelector('#codex').textContent=s.codexConnected?'已连接':'未连接';if(s.ok){appearance=s.appearance;applyDesktopTheme(appearance.colors);schemes=s.appearanceSchemes||schemes;activeSchemeId=s.activeSchemeId||activeSchemeId;modules=s.modules;if(!window.loaded){defaultImage=await window.passport.schemeImage('ocean');fillProfile();await renderSchemes();window.loaded=true}}}
document.querySelector('#start').onclick=async()=>{const r=await window.passport.start();toast(r.usb?'桥接启动，USB 已就绪':'桥接启动；请连接 USB 并开启调试');setTimeout(refresh,900)};document.querySelector('#stop').onclick=async()=>{await window.passport.stop();toast('桥接已停止');setTimeout(refresh,700)};document.querySelector('#addScheme').onclick=openEditor;document.querySelector('#cancelEditor').onclick=closeEditor;
document.querySelector('#choose').onclick=async()=>{imageBase64=await window.passport.chooseCharacter();if(imageBase64){document.querySelector('#previewImage').src='data:image/png;base64,'+imageBase64;document.querySelector('#defaultCharacter').classList.remove('hidden')}};document.querySelector('#defaultCharacter').onclick=()=>{imageBase64=null;document.querySelector('#previewImage').src=defaultImage;document.querySelector('#defaultCharacter').classList.add('hidden')};
document.querySelector('#saveScheme').onclick=async()=>{const name=document.querySelector('#schemeName').value.trim();if(!name)return toast('请填写方案名称');const c={};for(const k in colorKeys){c[k]=document.querySelector('#c-'+k).value;if(!/^#[0-9a-f]{6}$/i.test(c[k]))return toast('颜色必须使用 #RRGGBB 格式')}const payload={name,note:document.querySelector('#schemeNote').value,appearance:{theme:'custom',character:imageBase64?'custom':'default',colors:c,revision:Date.now()}};if(imageBase64)payload.imageBase64=imageBase64;const lib=await window.passport.saveScheme(payload);schemes=lib.schemes;activeSchemeId=lib.activeId;appearance=schemes.find(x=>x.id===activeSchemeId).appearance;applyDesktopTheme(appearance.colors);closeEditor();await renderSchemes();toast('新方案已应用到电脑并同步手机')};
function readModules(){modules.enabled=[];if(document.querySelector('#moduleCodex').checked)modules.enabled.push('codex');if(document.querySelector('#moduleProfile').checked)modules.enabled.push('profile');for(const k of ['name','headline','bio','website','email','contact'])modules.profile[k]=document.querySelector('#'+k).value}async function saveModules(){readModules();modules=await window.passport.saveModules(modules);toast('手机功能已同步')};document.querySelector('#saveModules').onclick=saveModules;document.querySelector('#saveProfile').onclick=saveModules;
applyDesktopTheme(appearance.colors);fillProfile();refresh();setInterval(refresh,2000);
</script></body></html>
